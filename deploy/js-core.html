<script>
var AUTH = '';   // PIN ที่ล็อกอินอยู่ — ส่งไปกับทุกคำขอ
var ME   = null; // ข้อมูลผู้ใช้ปัจจุบัน

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hide'); }
function hide(id){ $(id).classList.add('hide'); }
function say(id, text, kind){
  var el = $(id);
  el.className = 'msg ' + (kind || 'info');
  el.textContent = text;
}
function clearMsg(id){ var el = $(id); el.className = 'msg'; el.textContent = ''; }
function busy(btn, on, label){
  var b = $(btn);
  b.disabled = !!on;
  b.innerHTML = on ? '<span class="spin"></span> ' + label : label;
}

/* ================= เข้าสู่ระบบ ================= */
function doLogin(){
  var emp = $('empId').value.trim();
  var pin = $('pin').value.trim();
  if(!emp || !pin){ say('loginMsg','กรุณากรอกรหัสพนักงานและ PIN','err'); return; }
  clearMsg('loginMsg');
  busy('btnLogin', true, 'กำลังตรวจสอบ...');
  google.script.run
    .withSuccessHandler(function(r){
      busy('btnLogin', false, 'เข้าสู่ระบบ');
      if(!r || !r.ok){ say('loginMsg', (r && r.msg) || 'เข้าสู่ระบบไม่สำเร็จ','err'); return; }
      AUTH = pin; ME = r;
      enterApp();
    })
    .withFailureHandler(function(e){
      busy('btnLogin', false, 'เข้าสู่ระบบ');
      say('loginMsg','เกิดข้อผิดพลาด: ' + e.message,'err');
    })
    .loginEmpPin(emp, pin);
}

/* ================= ลงทะเบียนรับ PIN ================= */
function showReg(){ hide('viewLogin'); show('viewReg'); }
function backToLogin(){ hide('viewReg'); show('viewLogin'); clearMsg('regMsg'); }

function doRegister(){
  var emp  = $('regEmp').value.trim();
  var name = $('regName').value.trim();
  if(!emp || !name){ say('regMsg','กรุณากรอกรหัสพนักงานและชื่อ','err'); return; }
  clearMsg('regMsg');
  busy('btnReg', true, 'กำลังลงทะเบียน...');
  google.script.run
    .withSuccessHandler(function(r){
      busy('btnReg', false, 'ขอรหัส PIN');
      if(!r || !r.ok){ say('regMsg',(r && r.msg) || 'ลงทะเบียนไม่สำเร็จ','err'); return; }
      var el = $('regMsg');
      el.className = 'msg ok';
      el.innerHTML = 'สำเร็จ — คุณ ' + esc(r.name) + ' (' + esc(r.roleLabel) + ')' +
                     '<span class="pinbox">' + esc(r.pin) + '</span>' +
                     'จดรหัสนี้ไว้ ใช้เข้าระบบครั้งต่อไป';
    })
    .withFailureHandler(function(e){
      busy('btnReg', false, 'ขอรหัส PIN');
      say('regMsg','เกิดข้อผิดพลาด: ' + e.message,'err');
    })
    .registerUser(emp, name);
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ================= เข้าหน้าหลัก ================= */
var VIEWS = ['viewLogin','viewReg','viewMenu','viewDiag','viewOpenPO','viewImport','viewPoDb',
             'viewRrDb','viewDbLinks'];
function setView(id){
  VIEWS.forEach(function(v){ var el=$(v); if(el) el.classList.add('hide'); });
  var t=$(id); if(t) t.classList.remove('hide');
  // หน้าฐานข้อมูล PO ตารางกว้าง — ขยายกรอบให้กว้างขึ้น ลดการตัดคำในช่องชื่อสินค้า
  document.body.classList.toggle('wide', id === 'viewPoDb' || id === 'viewRrDb');
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToMenu(){ setView('viewMenu'); }

function enterApp(){
  hide('viewLogin'); hide('viewReg');
  $('whoText').textContent = ME.label + ' · ' + ME.roleLabel;
  $('hello').textContent = 'สวัสดี คุณ' + (ME.name || ME.label);
  show('who'); show('btnOut');
  if(ME.role === 'ADMIN') show('btnDiag');
  renderMenu();
  setView('viewMenu');
}

function logout(){
  AUTH = ''; ME = null;
  setView('viewLogin');
  hide('who'); hide('btnOut'); hide('btnDiag');
  $('empId').value = ''; $('pin').value = '';
  clearMsg('loginMsg');
}

/* ================= เมนู ================= */
/* ตอนนี้เป็นโครง — โมดูลจริงจะทยอยเปิดตามเฟส (ดูแผนแม่บท) */
var GROUPS = [
  { key:'buy',   name:'จัดซื้อ',      cls:'b-buy',   c:'var(--c-buy)',   t:'var(--c-buy-t)' },
  { key:'cost',  name:'ต้นทุน',       cls:'b-cost',  c:'var(--c-cost)',  t:'var(--c-cost-t)' },
  { key:'store', name:'คลังสินค้า',   cls:'b-store', c:'var(--c-store)', t:'var(--c-store-t)' },
  { key:'sys',   name:'งานระบบ',      cls:'b-sys',   c:'var(--c-sys)',   t:'var(--c-sys-t)' }
];

var MODULES = [
  { id:'db', g:'buy',   i:'🗃️', t:'ฐานข้อมูล PO',        d:'ทุกบรรทัดจาก My Account · ค้นหา กรอง ส่งออก',  roles:['PURCHASE','ADMIN','EXEC','STORE'],   phase:1, go:'openPoDb' },
  { id:'rr', g:'buy',   i:'📗', t:'ฐานข้อมูลการรับเข้า',  d:'ใบรับทุกใบทุกปี · ดูว่า PO ใบไหนของมาแล้ว',  roles:['PURCHASE','ADMIN','EXEC','STORE'],   phase:1, go:'openRrDb' },
  { id:'p2', g:'buy',   i:'📥', t:'PO ค้างรับ',          d:'ติดตามของที่ยังไม่เข้า รับข้ามปีได้',        roles:['PURCHASE','ADMIN','EXEC','STORE'],   phase:1, go:'openOpenPO' },
  { id:'p1', g:'buy',   i:'⬆️', t:'นำเข้าข้อมูล',        d:'ดึง PO/RR จาก My Account แล้วจับคู่',        roles:['PURCHASE','ADMIN'],                  phase:1, go:'openImport' },
  { id:'p3', g:'buy',   i:'💳', t:'แผนการจ่ายเงิน',       d:'วางบิล · ตั้งเบิก · ตัดยอดมัดจำ',           roles:['PURCHASE','ADMIN','EXEC'],           phase:4 },
  { id:'p4', g:'buy',   i:'📊', t:'สรุปการสั่งซื้อ',       d:'รายเดือน · ผู้ขาย · หมวด · จ๊อบ',           roles:['PURCHASE','ADMIN','EXEC'],           phase:6 },
  { id:'p7', g:'buy',   i:'🎯', t:'Dashboard KPI',        d:'ลดต้นทุน · ผู้ขายใหม่ · Performance',       roles:['ADMIN','EXEC','PURCHASE'],           phase:6 },
  { id:'p5', g:'buy',   i:'📝', t:'งานผู้รับเหมา',        d:'สัญญา · ใบรับเงิน ผูกกับ PO',              roles:['PURCHASE','ADMIN'],                  phase:7 },
  { id:'c1', g:'cost',  i:'💠', t:'ต้นทุน / ราคากลาง',     d:'ราคาซื้อล่าสุด · ต้นทุนเฉลี่ยถ่วงน้ำหนัก',  roles:['PURCHASE','ADMIN','EXEC'],           phase:3 },
  { id:'c2', g:'cost',  i:'🏷️', t:'Sales ขอราคา',         d:'ตอบราคาต้นทุนสำหรับงาน JM',                roles:['PURCHASE','ADMIN','EXEC'],           phase:5 },
  { id:'s1', g:'store', i:'📦', t:'รับสินค้าประจำวัน',     d:'กดรับตาม PO · ใช้มือถือได้',               roles:['STORE','PURCHASE','ADMIN'],          phase:2 },
  { id:'s2', g:'store', i:'🗂️', t:'Stock Card',           d:'ยอดคงเหลือ 3 คลัง แบบทันที',               roles:['STORE','PURCHASE','ADMIN','EXEC'],   phase:3 },
  { id:'s3', g:'store', i:'🧮', t:'นับสต๊อกประจำเดือน',   d:'ปิดงวด · ออกใบขอซื้อให้จัดซื้อ',           roles:['STORE','ADMIN'],                     phase:4 },
  { id:'s4', g:'store', i:'🧾', t:'มูลค่าสต๊อก + ABC',     d:'ส่งบัญชีเป็น Google Sheet',                roles:['STORE','ADMIN','EXEC'],              phase:5 },
  { id:'x1', g:'sys',   i:'🔗', t:'เปิดฐานข้อมูลตรง',      d:'ลิงก์ไฟล์ดิบ — ใช้ตอนหน้าเว็บมีปัญหา',      roles:['PURCHASE','ADMIN','EXEC','STORE'],   phase:1, go:'openDbLinks' }
];

function renderMenu(){
  var box = $('tiles');
  box.innerHTML = '';
  var total = 0;

  GROUPS.forEach(function(g){
    var mine = MODULES.filter(function(m){
      return m.g === g.key && m.roles.indexOf(ME.role) >= 0;
    });
    if(!mine.length) return;
    total += mine.length;

    var head = document.createElement('div');
    head.className = 'secthead';
    head.innerHTML = '<h3>' + esc(g.name) + '</h3><div class="line"></div>' +
                     '<span class="badge ' + g.cls + '">' + mine.length + ' โมดูล</span>';
    box.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'tiles';
    mine.forEach(function(m){
      var d = document.createElement('div');
      d.className = 'tile ' + (m.go ? 'live' : 'soon');
      d.style.setProperty('--tc', g.c);
      d.style.setProperty('--tt', g.t);
      d.innerHTML =
        '<div class="ico">' + m.i + '</div>' +
        '<b>' + esc(m.t) + '</b>' +
        '<span class="d">' + esc(m.d) + '</span>' +
        '<div class="foot">' + (m.go
          ? '<span class="badge b-live">พร้อมใช้งาน</span>'
          : '<span class="badge b-soon">เฟส ' + m.phase + '</span>') + '</div>';
      if(m.go) d.onclick = (function(fn){ return function(){ window[fn](); }; })(m.go);
      grid.appendChild(d);
    });
    box.appendChild(grid);
  });

  var live = MODULES.filter(function(m){ return m.go && m.roles.indexOf(ME.role) >= 0; }).length;
  $('menuNote').textContent =
    'บทบาทของคุณเห็น ' + total + ' โมดูล · เปิดใช้งานแล้ว ' + live +
    ' · ที่เหลือจะทยอยเปิดตามเฟสที่วางไว้';
}

/* ================= ตรวจระบบ (ADMIN) ================= */
function openDiag(){
  setView('viewDiag');
  $('diagBody').innerHTML = '<p class="small">กำลังตรวจ...</p>';
  google.script.run
    .withSuccessHandler(function(r){
      var h = '<div class="statrow">' +
        stat(r.passed + ' / ' + r.checks.length, 'ผ่าน', r.failed ? 'var(--bad)' : 'var(--ok)') +
        stat(r.totalMs + ' ms', 'เวลารวม', 'var(--text)') +
        stat(r.version, 'เวอร์ชัน', 'var(--brand)') +
        stat(r.build, 'วันที่สร้าง', 'var(--text-2)') +
        '</div>';
      h += '<div class="tblwrap"><table><thead><tr>' +
           '<th>รายการตรวจ</th><th>ผล</th><th>เวลา</th><th>รายละเอียด</th>' +
           '</tr></thead><tbody>';
      r.checks.forEach(function(c){
        h += '<tr><td>' + esc(c.name) + '</td>' +
             '<td class="nw ' + (c.ok ? 'ok-t' : 'bad-t') + '">' + (c.ok ? 'ผ่าน' : 'ไม่ผ่าน') + '</td>' +
             '<td class="nw num muted">' + c.ms + ' ms</td>' +
             '<td>' + esc(c.ok ? c.detail : c.error) + '</td></tr>';
      });
      h += '</tbody></table></div>';
      $('diagBody').innerHTML = h;
    })
    .withFailureHandler(function(e){
      $('diagBody').innerHTML = '<div class="msg err" style="display:block">ตรวจไม่สำเร็จ: ' +
                                esc(e.message) + '</div>';
    })
    .psDiag(AUTH);
}
function stat(v, l, color){
  return '<div class="stat"><div class="v" style="color:' + color + '">' + esc(v) +
         '</div><div class="l">' + esc(l) + '</div></div>';
}
function closeDiag(){ setView('viewMenu'); }

/* ================= Enter = ส่งฟอร์ม ================= */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(!$('viewLogin').classList.contains('hide')) doLogin();
  else if(!$('viewReg').classList.contains('hide')) doRegister();
});
</script>
