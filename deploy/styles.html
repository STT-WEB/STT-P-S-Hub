<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   NOVA – PURCHASE & STORE HUB · Design System
   สีหลักดึงจากโลโก้ STT จริง: แดง #E41824 · ดำ #101215
   =========================================================== */
:root{
  /* --- สีประจำบริษัท (วัดจากไฟล์โลโก้) --- */
  --brand:#E41824;  --brand-600:#CC1420;  --brand-700:#A8101A;
  --brand-tint:#FEECEE;  --brand-line:#F7C9CE;

  /* --- โครงสีเข้ม (จากตัวอักษรในโลโก้) --- */
  --ink:#12151A;  --ink-2:#1B2028;  --ink-3:#252C36;

  /* --- พื้นผิว / เส้น / ตัวอักษร --- */
  --bg:#F4F5F7;  --surface:#FFFFFF;  --surface-2:#FAFBFC;
  --line:#E4E7EC;  --line-2:#EFF1F4;
  --text:#12151A;  --text-2:#475062;  --text-3:#79828F;

  /* --- สีเสริมสำหรับแยกหมวดงาน --- */
  --c-buy:#1D6FD1;    --c-buy-t:#EAF2FD;      /* จัดซื้อ */
  --c-store:#0E7C86;  --c-store-t:#E4F5F6;    /* สโตร์ */
  --c-cost:#6B3FBF;   --c-cost-t:#F1EBFD;     /* ต้นทุน */
  --c-sys:#4A5565;    --c-sys-t:#EEF0F3;      /* งานระบบ */

  /* --- สีบอกสถานะ --- */
  --ok:#0E8A52;  --ok-t:#E6F6EE;
  --warn:#B5710A;  --warn-t:#FFF6E5;
  --bad:#C0182B;  --bad-t:#FDECEE;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --sh-1:0 1px 2px rgba(16,20,28,.06), 0 1px 3px rgba(16,20,28,.04);
  --sh-2:0 2px 6px rgba(16,20,28,.07), 0 8px 24px rgba(16,20,28,.06);
  --sh-3:0 10px 34px rgba(16,20,28,.13);
  --fast:.16s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Sarabun","Leelawadee UI","Tahoma",system-ui,sans-serif;
  font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
.num,.mono{font-family:"Inter",ui-monospace,"Consolas",monospace;font-variant-numeric:tabular-nums}

/* ================= TOP BAR ================= */
.topbar{
  background:linear-gradient(103deg,var(--ink) 0%,var(--ink-2) 58%,var(--ink-3) 100%);
  color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(255,255,255,.06),var(--sh-2);
}
.topbar::after{content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand) 34%,rgba(228,24,36,.25) 60%,rgba(228,24,36,0) 100%)}
.topbar .inner{max-width:1180px;margin:0 auto;padding:11px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark img{height:30px;width:auto;display:block;flex:0 0 auto}
.brandtext{min-width:0;line-height:1.25}
.brandtext .n{font-weight:700;font-size:15.5px;letter-spacing:.2px;white-space:nowrap}
.brandtext .s{font-size:11.5px;color:rgba(255,255,255,.62);letter-spacing:.5px;
  text-transform:uppercase;white-space:nowrap}
.spacer{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);padding:5px 12px;border-radius:99px;font-size:13px;
  white-space:nowrap;backdrop-filter:blur(6px)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#3ddc8a;flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(61,220,138,.18)}
.tbtn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);color:#fff;
  font:inherit;font-size:13.5px;font-weight:500;padding:6px 14px;border-radius:9px;
  cursor:pointer;transition:var(--fast);white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.tbtn:active{transform:translateY(1px)}
.tbtn.danger:hover{background:var(--brand);border-color:var(--brand)}
.ver{font-family:"Inter",monospace;font-size:12.5px;font-weight:700;letter-spacing:.3px;
  background:var(--brand);color:#fff;padding:5px 11px;border-radius:99px;
  box-shadow:0 2px 10px rgba(228,24,36,.42);white-space:nowrap}

/* ================= LAYOUT ================= */
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 72px}
body.wide .wrap,body.wide .topbar .inner{max-width:1580px}
/* ตารางฐานข้อมูลมีคอลัมน์เยอะ — บีบระยะขอบให้พอดีจอ ไม่ต้องเลื่อนแนวนอน */
body.wide table{font-size:13.5px}
body.wide th,body.wide td{padding:9px 10px}
.page-head{margin:0 0 20px}
.page-head h1{margin:0 0 4px;font-size:23px;font-weight:700;letter-spacing:-.2px}
.page-head p{margin:0;color:var(--text-2);font-size:14.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--brand);margin:0 0 6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);padding:24px}
.card + .card{margin-top:16px}
.card-pad-sm{padding:18px}

/* ================= LOGIN ================= */
.authwrap{min-height:calc(100vh - 220px);display:flex;align-items:center;justify-content:center;padding:14px 0}
.authcard{width:100%;max-width:412px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--sh-3);overflow:hidden}
.authcard .top{padding:30px 32px 0;text-align:center}
.authcard .top img{height:44px;width:auto;margin-bottom:14px}
.authcard .top h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.authcard .top p{margin:0;color:var(--text-3);font-size:13.5px}
.authcard .body{padding:22px 32px 30px}
.authcard .foot{padding:14px 32px;background:var(--surface-2);border-top:1px solid var(--line-2);
  font-size:12.5px;color:var(--text-3);text-align:center}

.field{margin-top:16px}
.field:first-child{margin-top:0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);
  letter-spacing:.3px;margin-bottom:6px}
input[type=text],input[type=password],input[type=tel]{
  width:100%;font:inherit;font-size:16.5px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);
  color:var(--text);transition:var(--fast)}
input::placeholder{color:#AEB5BF}
input:hover{border-color:#CFD5DD}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3.5px var(--brand-tint)}
.pinput{letter-spacing:.32em;font-family:"Inter",monospace}

.btn{display:block;width:100%;font:inherit;font-size:16px;font-weight:600;
  padding:13px 18px;border:0;border-radius:var(--r);cursor:pointer;transition:var(--fast);
  background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(228,24,36,.3)}
.btn:hover{background:var(--brand-600);box-shadow:0 4px 16px rgba(228,24,36,.36)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#C9CFD8;box-shadow:none;cursor:default;color:#fff}
.btn.ghost{background:transparent;color:var(--text-2);border:1.5px solid var(--line);
  box-shadow:none;font-weight:500;font-size:14.5px;padding:11px 18px}
.btn.ghost:hover{background:var(--surface-2);border-color:#CFD5DD;color:var(--text)}
.btn + .btn{margin-top:10px}
.mt{margin-top:20px}

.msg{margin-top:16px;padding:12px 14px;border-radius:var(--r);font-size:14px;display:none;
  border-inline-start:3px solid transparent;line-height:1.6}
.msg.err{display:block;background:var(--bad-t);color:var(--bad);border-color:var(--bad)}
.msg.ok{display:block;background:var(--ok-t);color:var(--ok);border-color:var(--ok)}
.msg.info{display:block;background:#EEF3FB;color:var(--c-buy);border-color:var(--c-buy)}
.pinbox{display:block;font-family:"Inter",monospace;font-size:30px;font-weight:700;
  letter-spacing:.16em;margin:10px 0 2px;color:var(--ok)}

/* ================= MODULE TILES ================= */
.secthead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.secthead h3{margin:0;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--text-3)}
.secthead .line{flex:1 1 auto;height:1px;background:var(--line);min-width:20px}
.tiles{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:620px){.tiles{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.tiles{grid-template-columns:repeat(3,1fr)}}

.tile{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--sh-1);
  transition:var(--fast);overflow:hidden;text-align:start}
.tile::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;
  background:var(--tc,var(--c-buy));opacity:.9}
.tile.live{cursor:pointer}
.tile.live:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:#D3D9E0}
.tile.soon{opacity:.72}
.tile .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:19px;background:var(--tt,var(--c-buy-t));margin-bottom:11px}
.tile b{display:block;font-size:15.5px;font-weight:600;margin-bottom:3px;letter-spacing:-.1px}
.tile span.d{display:block;font-size:13px;color:var(--text-2);line-height:1.55}
.tile .foot{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:7px;letter-spacing:.3px;white-space:nowrap}
.b-soon{background:var(--warn-t);color:var(--warn)}
.b-live{background:var(--ok-t);color:var(--ok)}
.b-buy{background:var(--c-buy-t);color:var(--c-buy)}
.b-store{background:var(--c-store-t);color:var(--c-store)}
.b-cost{background:var(--c-cost-t);color:var(--c-cost)}
.b-sys{background:var(--c-sys-t);color:var(--c-sys)}

/* ================= TABLE (หน้าตรวจระบบ) ================= */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
th,td{padding:10px 13px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line-2)}
th{background:var(--surface-2);font-weight:600;font-size:12.5px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--text-3);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.nw{white-space:nowrap}
.ok-t{color:var(--ok);font-weight:600}
.bad-t{color:var(--bad);font-weight:600}
.muted{color:var(--text-3)}

/* minmax(0,1fr) จำเป็น — ไม่งั้นตัวเลขยาว ๆ ดันช่องจนจอมือถือล้น */
.statrow{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:4px}
@media(min-width:620px){.statrow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);
  padding:13px 15px;min-width:0}
.stat .v{font-family:"Inter",monospace;font-size:22px;font-weight:700;line-height:1.2;
  overflow-wrap:anywhere}
.stat .l{font-size:12px;color:var(--text-3);margin-top:2px}
@media(max-width:619px){.stat{padding:11px 12px}.stat .v{font-size:18px}}


/* ===== หน้าจอใหม่ (PO ค้างรับ / นำเข้าข้อมูล) ===== */
.agegrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:760px){.agegrid{grid-template-columns:repeat(5,1fr)}}
.agebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;
  border:1.5px solid var(--line);border-radius:var(--r);padding:11px 13px;cursor:pointer;
  font:inherit;text-align:start;transition:var(--fast)}
.agebtn:hover{border-color:#C6CDD6;box-shadow:var(--sh-1)}
.agebtn.on{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 3px rgba(228,24,36,.10)}
.agebtn b{font-size:13.5px;font-weight:600}
.agebtn .n{font-size:12px;color:var(--text-3)}
.agebtn .v{font-family:"Inter",ui-monospace,monospace;font-size:14px;font-weight:700;margin-top:2px}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;margin-bottom:3px}
.bar2{height:11px;border-radius:6px;background:#E8EBEF;overflow:hidden;display:flex;margin:12px 0 2px}
.bar2 i{display:block;height:100%}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.sub{font-size:12px;color:var(--text-3);font-weight:400;margin-top:1px}
.num{font-family:"Inter",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
td.num{text-align:end}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row2{display:flex;gap:14px;flex-wrap:wrap}
.row2 > .field{flex:1 1 200px;min-width:0}
.b-warn2{background:var(--warn-t);color:var(--warn)}


/* ===== กล่องแก้ไขของจัดซื้อ ===== */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,14,20,.55);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;
  backdrop-filter:blur(2px)}
.modal .box{background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-3);width:100%;max-width:620px;
  overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.modal .mh b{font-size:17px;display:block}
.modal .mh .sub{font-size:13px;color:var(--text-3);margin-top:2px}
.modal .mb{padding:18px 22px;max-height:calc(100vh - 260px);overflow-y:auto}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal .mf .btn{width:auto;padding-inline:24px;margin-top:0}
.fgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:520px){.fgrid{grid-template-columns:1fr 1fr}}
.fgrid .full{grid-column:1/-1}
.fgrid .field{margin-top:0}
select{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--text)}
select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3.5px var(--brand-tint)}
textarea{width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--text);resize:vertical;min-height:64px}
textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3.5px var(--brand-tint)}
.chk{display:flex;align-items:center;gap:9px;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:var(--r);cursor:pointer;font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
.chk.on{border-color:var(--bad);background:var(--bad-t);color:var(--bad);font-weight:600}
.hint{font-size:12.5px;color:var(--text-3);margin-top:5px;line-height:1.5}
.editbtn{background:transparent;border:1.5px solid var(--line);color:var(--text-2);font:inherit;
  font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:var(--fast)}
.editbtn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag2{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.t-manual{background:var(--c-buy-t);color:var(--c-buy)}
.t-billed{background:var(--c-cost-t);color:var(--c-cost)}
.t-intl{background:var(--c-store-t);color:var(--c-store)}
.t-note{background:var(--warn-t);color:var(--warn)}


/* ===== หน้าฐานข้อมูล PO ===== */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip2{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);
  border-radius:99px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer;transition:var(--fast)}
.chip2:hover{border-color:#C6CDD6}
.chip2.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip2 .cn{font-family:"Inter",ui-monospace,monospace;font-size:12px;font-weight:700;
  background:rgba(0,0,0,.07);padding:1px 7px;border-radius:99px}
.chip2.on .cn{background:rgba(255,255,255,.2)}
.filterbar{display:grid;gap:12px;grid-template-columns:1fr;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-lg);padding:16px 18px;margin:14px 0;box-shadow:var(--sh-1)}
@media(min-width:680px){.filterbar{grid-template-columns:1fr 1fr 1fr}}
.fb{display:flex;flex-direction:column;gap:5px;min-width:0}
.fb label{margin:0;font-size:12px}
/* ตัดข้อความยาวให้เหลือ 2 บรรทัด — ชื่อเต็มอยู่ใน title (เอาเมาส์ชี้เห็น) */
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-open{background:#FFF1F2;color:var(--bad)}
.b-cancel{background:#EEF0F3;color:var(--text-3);text-decoration:line-through}
tr.rcancel td{opacity:.55}

.hide{display:none!important}
.small{font-size:13px;color:var(--text-3)}
.center{text-align:center}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:sp .65s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:560px){
  .topbar .inner{padding:10px 14px;gap:9px}
  .brandtext .s{display:none}
  .wrap{padding:20px 14px 60px}
  .card{padding:18px}
  .authcard .top{padding:26px 22px 0}
  .authcard .body{padding:18px 22px 24px}
  .authcard .foot{padding:12px 22px}
}
</style>
