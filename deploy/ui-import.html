<script>
/* ============ หน้าอัปเดตข้อมูล (P1) ============
   ไฟล์เดียวต่อปี — ระบบอ่านแท็บ ps_report / RR จากไฟล์ของเบียร์โดยตรง
   ขั้นที่ 1 ทำครั้งเดียวตอนเริ่มปี · ขั้นที่ 2 กดทุกวันหลังวางข้อมูลใหม่           */
function openImport(){ setView('viewImport'); $('imBody').innerHTML = imForm(); }

function imForm(){
  return '' +
  '<div class="card">' +
    '<h3 style="margin-top:0">ขั้นที่ 1 · ติดตั้งครั้งเดียวตอนเริ่มปี</h3>' +
    '<p class="small">วางลิงก์ไฟล์ <b>PO Report ของปีนี้</b> (ไฟล์ที่มีแท็บ ps_report กับ RR)<br>' +
    'ระบบจะ <b>เพิ่มแท็บของตัวเองเข้าไปในไฟล์เดียวกัน</b> ไม่ก๊อปข้อมูลออกไปไหน และไม่แตะ 2 แท็บนั้นเลย<br>' +
    'กดซ้ำได้ ไม่ทับของเดิม · ปีหน้าค่อยวางลิงก์ไฟล์ปีใหม่</p>' +
    '<div class="field"><label for="imUrl">ลิงก์ไฟล์ PO Report ของปีนี้</label>' +
      '<input type="text" id="imUrl" placeholder="https://docs.google.com/spreadsheets/d/..."></div>' +
    '<button class="btn" id="btnSetup" style="width:auto;padding-inline:26px" onclick="doSetup()">ติดตั้งลงในไฟล์นี้</button>' +
  '</div>' +
  '<div class="card">' +
    '<h3 style="margin-top:0">ขั้นที่ 2 · อัปเดตข้อมูล (กดทุกวันหลังวางข้อมูลใหม่)</h3>' +
    '<p class="small">อ่าน ps_report กับ RR ที่วางไว้ → จับคู่ด้วยรหัสสินค้า 5 ชั้น (C1–C5) → ' +
    'เขียนแท็บ รายงาน PO · รายงานการรับเข้า · สรุปภาพรวม ใหม่ทั้งหมด<br>' +
    '<b>สิ่งที่จัดซื้อกรอกไว้ไม่หาย</b> เพราะอยู่คนละแท็บ (ช่องที่จัดซื้อกรอก) และผูกด้วยรหัสบรรทัด</p>' +
    '<button class="btn" id="btnRb" style="width:auto;padding-inline:26px" onclick="doRebuild()">อัปเดตข้อมูลตอนนี้</button>' +
  '</div>' +
  '<div id="imOut"></div>';
}

function imBusy(id, on, label){ busy(id, on, label); }

function doSetup(){
  var url = $('imUrl').value.trim();
  imBusy('btnSetup', true, 'กำลังติดตั้ง...');
  $('imOut').innerHTML = '';
  google.script.run
    .withSuccessHandler(function(r){
      imBusy('btnSetup', false, 'ติดตั้งลงในไฟล์นี้');
      var h = '<div class="card"><h3 style="margin-top:0">ผลการติดตั้ง — ปี ' + esc(r.year) + '</h3>' +
              '<div class="statrow">' +
                stat(r.passed + ' / ' + r.steps.length, 'สำเร็จ', r.failed ? 'var(--bad)' : 'var(--ok)') +
                stat(r.totalMs + ' ms', 'เวลารวม', 'var(--text)') +
              '</div><div class="tblwrap"><table><thead><tr><th>ขั้นตอน</th><th>ผล</th><th>เวลา</th><th>รายละเอียด</th></tr></thead><tbody>';
      r.steps.forEach(function(s){
        h += '<tr><td>' + esc(s.name) + '</td>' +
             '<td class="nw ' + (s.ok?'ok-t':'bad-t') + '">' + (s.ok?'สำเร็จ':'ไม่สำเร็จ') + '</td>' +
             '<td class="nw num muted">' + s.ms + ' ms</td>' +
             '<td>' + esc(s.ok ? s.detail : s.error) + '</td></tr>';
      });
      h += '</tbody></table></div></div>';
      $('imOut').innerHTML = h;
    })
    .withFailureHandler(function(e){
      imBusy('btnSetup', false, 'ติดตั้งลงในไฟล์นี้');
      $('imOut').innerHTML = '<div class="msg err" style="display:block">' + esc(e.message) + '</div>';
    })
    .psSetup(AUTH, url);
}

function doRebuild(){
  imBusy('btnRb', true, 'กำลังอัปเดต...');
  $('imOut').innerHTML = '';
  google.script.run
    .withSuccessHandler(function(r){
      imBusy('btnRb', false, 'อัปเดตข้อมูลตอนนี้');
      var h = '<div class="card"><h3 style="margin-top:0">อัปเดตเรียบร้อย — ปี ' + esc(r.year) + '</h3>' +
        '<div class="statrow">' +
          stat(r.matchPct.toFixed(2) + '%', 'จับคู่สำเร็จ', r.unmatched ? 'var(--warn)' : 'var(--ok)') +
          stat(Number(r.openLines).toLocaleString(), 'บรรทัดค้างรับ', 'var(--brand)') +
          stat(money(r.openValue), 'มูลค่าค้างรับ (บาท)', 'var(--brand)') +
          stat((r.ms/1000).toFixed(1) + ' วิ', 'เวลา', 'var(--text-2)') +
        '</div>' +
        '<div class="tblwrap"><table><thead><tr><th>รายการ</th><th style="text-align:end">จำนวน</th></tr></thead><tbody>' +
        '<tr><td>อ่านจากแท็บ ps_report</td><td class="num">' + Number(r.poRead).toLocaleString() +
          (r.poSkipped ? ' <span class="muted">(ข้าม ' + r.poSkipped + ')</span>' : '') + '</td></tr>' +
        '<tr><td>อ่านจากแท็บ RR</td><td class="num">' + Number(r.rrRead).toLocaleString() +
          (r.rrSkipped ? ' <span class="muted">(ข้าม ' + r.rrSkipped + ')</span>' : '') + '</td></tr>' +
        '<tr><td>PO ที่ใช้งาน (ไม่รวมยกเลิก)</td><td class="num">' + Number(r.poLines).toLocaleString() + '</td></tr>';
      ['C1','C2','C3','C4','C5'].forEach(function(t){
        if(r.tiers[t]) h += '<tr><td>จับคู่ชั้น ' + t + '</td><td class="num ok-t">' +
                            Number(r.tiers[t]).toLocaleString() + '</td></tr>';
      });
      h += '<tr><td>อ้าง PO ปีอื่น (รับข้ามปี)</td><td class="num">' + Number(r.noPO).toLocaleString() + '</td></tr>' +
           '<tr><td>จับคู่ไม่ได้ ทั้งที่ PO อยู่ในระบบ</td><td class="num ' +
             (r.unmatched ? 'bad-t' : 'ok-t') + '">' + Number(r.unmatched).toLocaleString() + '</td></tr>' +
           '<tr><td>รับเกินที่สั่ง</td><td class="num ' + (r.over ? 'bad-t' : 'ok-t') + '">' +
             Number(r.over).toLocaleString() + '</td></tr>' +
           '<tr><td>เขียนลงแท็บ รายงาน PO</td><td class="num">' + Number(r.indexLines).toLocaleString() + '</td></tr>' +
           '<tr><td>ใบ PO ที่ยังค้างรับ</td><td class="num">' + Number(r.openDocs).toLocaleString() + '</td></tr>' +
           '<tr><td>เก็บใบรับลงไฟล์สะสมข้ามปี</td><td class="num">' +
             (r.rrAll ? Number(r.rrAll.fresh).toLocaleString() : '—') + '</td></tr>' +
           '</tbody></table></div>';
      if(r.reportError)
        h += '<div class="msg warn" style="display:block">ตัวเลขคำนวณเสร็จแล้ว แต่เขียนแท็บรายงานไม่สำเร็จ: ' +
             esc(r.reportError) + '</div>';
      h += '<div class="btnrow mt">' +
        '<button class="btn" style="width:auto;padding-inline:24px" onclick="openPoDb()">ไปหน้าฐานข้อมูล PO</button>' +
        '<button class="btn ghost" style="width:auto;padding-inline:24px" onclick="openDbLinks()">เปิดชีตดูเอง</button>' +
        '</div></div>';
      $('imOut').innerHTML = h;
    })
    .withFailureHandler(function(e){
      imBusy('btnRb', false, 'อัปเดตข้อมูลตอนนี้');
      $('imOut').innerHTML = '<div class="msg err" style="display:block">' + esc(e.message) + '</div>';
    })
    .psRebuild(AUTH);
}
</script>
