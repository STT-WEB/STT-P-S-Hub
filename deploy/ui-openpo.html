<script>
/* ============ หน้า PO ค้างรับ (P2) ============ */
var OP = { page:1, age:'', q:'' };

function openOpenPO(){
  setView('viewOpenPO');
  OP.page = 1;
  loadOpenPO();
}

function opFilter(age){
  OP.age = (OP.age === age) ? '' : age;
  OP.page = 1;
  loadOpenPO();
}
function opSearch(){ OP.q = $('opQ').value.trim(); OP.page = 1; loadOpenPO(); }
function opPage(d){ OP.page += d; loadOpenPO(); }

function loadOpenPO(){
  $('opBody').innerHTML = '<p class="small">กำลังโหลด...</p>';
  var t0 = new Date().getTime();
  google.script.run
    .withSuccessHandler(function(r){ renderOpenPO(r, new Date().getTime()-t0); })
    .withFailureHandler(function(e){
      $('opBody').innerHTML = '<div class="msg err" style="display:block">โหลดไม่สำเร็จ: ' +
        esc(e.message) + '</div>';
    })
    .getOpenPO(AUTH, { page: OP.page, age: OP.age, q: OP.q });
}

function money(n){
  if(n === null || n === undefined) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function qty(n){
  return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
}

var AGEC = { '0-7':'var(--ok)', '8-30':'#6AB04C', '31-60':'#D8A21A', '61-90':'#E08A2E', '90+':'var(--bad)' };
var AGEL = { '0-7':'0–7 วัน', '8-30':'8–30 วัน', '31-60':'31–60 วัน', '61-90':'61–90 วัน', '90+':'เกิน 90 วัน' };

function renderOpenPO(r, ms){
  var h = '';

  /* --- สรุปด้านบน --- */
  h += '<div class="statrow">' +
       stat(Number(r.sum.lines).toLocaleString(), 'บรรทัดค้างรับ', 'var(--text)') +
       stat(Number(r.sum.docs).toLocaleString(), 'ใบ PO', 'var(--text)') +
       stat(r.canPrice ? money(r.sum.value) : 'ซ่อน', r.canPrice ? 'มูลค่ารวม (บาท)' : 'สโตร์ไม่เห็นราคา',
            r.canPrice ? 'var(--brand)' : 'var(--text-3)') +
       stat(ms + ' ms', 'เวลาโหลด', 'var(--text-2)') +
       '</div>';

  /* --- แถบอายุ กดกรองได้ --- */
  var tot = 0;
  r.buckets.forEach(function(b){ tot += b.n; });
  h += '<div class="secthead"><h3>กรองตามอายุ</h3><div class="line"></div>' +
       (OP.age ? '<button class="tbtn" style="background:var(--bad);border-color:var(--bad)" onclick="opFilter(\'' +
        OP.age + '\')">ล้างตัวกรอง</button>' : '') + '</div>';
  h += '<div class="agegrid">';
  r.buckets.forEach(function(b){
    var on = (OP.age === b.key);
    h += '<button class="agebtn' + (on ? ' on' : '') + '" onclick="opFilter(\'' + b.key + '\')">' +
         '<span class="dotc" style="background:' + AGEC[b.key] + '"></span>' +
         '<b>' + esc(AGEL[b.key]) + '</b>' +
         '<span class="n">' + Number(b.n).toLocaleString() + ' บรรทัด</span>' +
         (r.canPrice ? '<span class="v">' + money(b.v) + '</span>' : '') +
         '</button>';
  });
  h += '</div>';

  /* --- แถบสัดส่วน --- */
  if(r.canPrice){
    var sumv = 0; r.buckets.forEach(function(b){ sumv += (b.v||0); });
    if(sumv > 0){
      h += '<div class="bar2">';
      r.buckets.forEach(function(b){
        var p = (b.v||0)/sumv*100;
        if(p > 0) h += '<i style="width:' + p.toFixed(2) + '%;background:' + AGEC[b.key] +
                       '" title="' + AGEL[b.key] + ' ' + p.toFixed(1) + '%"></i>';
      });
      h += '</div><p class="small">แถบนี้คือสัดส่วน<b>มูลค่า</b> ไม่ใช่จำนวนบรรทัด — ของเก่ามักน้อยบรรทัดแต่เงินก้อนใหญ่</p>';
    }
  }

  /* --- ตาราง --- */
  h += '<div class="secthead"><h3>รายการ</h3><div class="line"></div>' +
       '<span class="small">หน้า ' + r.page + ' / ' + r.pages + ' · ' +
       Number(r.total).toLocaleString() + ' บรรทัด</span></div>';

  if(!r.rows.length){
    h += '<div class="card" style="text-align:center;color:var(--text-3)">ไม่พบรายการที่ตรงกับเงื่อนไข</div>';
  } else {
    h += '<div class="tblwrap"><table><thead><tr>' +
         '<th>เลขที่ PO</th><th>สินค้า</th><th>ผู้ขาย</th>' +
         '<th style="text-align:end">สั่ง</th><th style="text-align:end">รับแล้ว</th>' +
         '<th style="text-align:end">ค้าง</th>' +
         (r.canPrice ? '<th style="text-align:end">มูลค่าค้าง</th>' : '') +
         '<th style="text-align:end">อายุ</th><th>สถานะ</th>' +
         (r.canEdit ? '<th></th>' : '') +
         '</tr></thead><tbody>';
    r.rows.forEach(function(x){
      var ac = x.age > 90 ? 'var(--bad)' : (x.age > 60 ? 'var(--warn)' : 'var(--text-2)');
      h += '<tr>' +
        '<td class="nw"><b>' + esc(x.po) + '</b><div class="sub">บรรทัด ' + esc(x.ln) +
          ' · ' + esc(x.date) + '</div></td>' +
        '<td>' + esc(x.name) + '<div class="sub mono">' + esc(x.code) +
          (x.job ? ' · จ๊อบ ' + esc(x.job) : '') + '</div></td>' +
        '<td>' + esc(x.vendor) + '</td>' +
        '<td class="num nw">' + qty(x.ordered) + ' <span class="sub">' + esc(x.unit) + '</span></td>' +
        '<td class="num nw">' + ((x.received + x.manual) > 0 ? qty(x.received + x.manual) :
          '<span class="muted">—</span>') + '</td>' +
        '<td class="num nw"><b>' + qty(x.remain) + '</b></td>' +
        (r.canPrice ? '<td class="num nw">' + money(x.value) + '</td>' : '') +
        '<td class="num nw" style="color:' + ac + ';font-weight:600">' + x.age + ' วัน</td>' +
        '<td class="nw"><span class="badge ' + (x.received + x.manual > 0 ? 'b-warn2' : 'b-sys') + '">' +
          esc(x.status) + '</span>' + tagsOf(x) + '</td>' +
        (r.canEdit ? '<td class="nw"><button class="editbtn" onclick="opEdit(\'' +
          esc(x.poid) + '\',\'' + esc(x.ln) + '\',\'' + esc(x.po) + '\')">แก้</button></td>' : '') +
        '</tr>';
    });
    h += '</tbody></table></div>';

    if(r.pages > 1){
      h += '<div class="pager">' +
        '<button class="btn ghost" style="width:auto" ' + (r.page<=1?'disabled':'') +
          ' onclick="opPage(-1)">ก่อนหน้า</button>' +
        '<span class="small">หน้า ' + r.page + ' / ' + r.pages + '</span>' +
        '<button class="btn ghost" style="width:auto" ' + (r.page>=r.pages?'disabled':'') +
          ' onclick="opPage(1)">ถัดไป</button></div>';
    }
  }
  $('opBody').innerHTML = h;
}
</script>

<script>
/* ============ ป้ายบอกสิ่งที่จัดซื้อกรอกไว้ ============ */
function tagsOf(x){
  var t = '';
  if(x.manual > 0)  t += '<span class="tag2 t-manual">ยืนยันเอง ' + qty(x.manual) + '</span>';
  if(x.billed)      t += '<span class="tag2 t-billed">ตั้งเบิก ' + money(x.billed) + '</span>';
  if(x.intl)        t += '<span class="tag2 t-intl">' + esc(x.intl) + '</span>';
  if(x.newship)     t += '<span class="tag2 t-intl">นัดใหม่ ' + esc(x.newship) + '</span>';
  if(x.note)        t += '<span class="tag2 t-note" title="' + esc(x.note) + '">มีหมายเหตุ</span>';
  return t ? '<div class="tags">' + t + '</div>' : '';
}

/* ============ กล่องแก้ไข — 6 ช่องที่จัดซื้อต้องใส่เอง ============ */
var EDITING = null;

function opEdit(poid, ln, po){
  EDITING = { poid: poid, ln: ln, po: po };
  var w = document.createElement('div');
  w.className = 'modal'; w.id = 'editModal';
  w.innerHTML = '<div class="box"><div class="mh"><b>' + esc(po) + ' · บรรทัด ' + esc(ln) +
                '</b><div class="sub">กำลังโหลด...</div></div><div class="mb" id="edBody">' +
                '<p class="small">กำลังโหลด...</p></div></div>';
  document.body.appendChild(w);
  w.onclick = function(e){ if(e.target === w) opCloseEdit(); };

  google.script.run
    .withSuccessHandler(function(r){ renderEdit(r, po, ln); })
    .withFailureHandler(function(e){
      $('edBody').innerHTML = '<div class="msg err" style="display:block">' + esc(e.message) + '</div>';
    })
    .getPoEdit(AUTH, poid, ln);
}
function opCloseEdit(){
  var m = $('editModal'); if(m) m.remove();
  EDITING = null;
}

function renderEdit(r, po, ln){
  var e = r.edit;
  var opts = r.intlOptions.map(function(o){
    return '<option value="' + esc(o) + '"' + (o === e.intl_status ? ' selected' : '') + '>' +
           (o || '— ไม่ระบุ —') + '</option>';
  }).join('');

  var h = '<div class="fgrid">' +
    '<div class="field"><label for="edRecv">ยืนยันรับของเอง (จำนวน)</label>' +
      '<input type="text" id="edRecv" inputmode="decimal" value="' + (e.recv_manual || '') + '">' +
      '<div class="hint">ใช้กับของต่างประเทศ หรือของที่มาถึงแล้วแต่ยังไม่มีใบรับในระบบ</div></div>' +
    '<div class="field"><label for="edRecvDate">วันที่รับของจริง</label>' +
      '<input type="date" id="edRecvDate" value="' + isoDate(e.recv_date) + '"></div>' +

    '<div class="field"><label for="edBilled">ยอดที่ตั้งเบิกบัญชีไปแล้ว (บาท)</label>' +
      '<input type="text" id="edBilled" inputmode="decimal" value="' + (e.billed_amount || '') + '">' +
      '<div class="hint">บัญชีรับรู้ยอดนี้ไปแล้ว ระบบจะหักออกจากมูลค่าค้างรับให้</div></div>' +
    '<div class="field"><label for="edBilledNote">เลขที่ใบตั้งเบิก</label>' +
      '<input type="text" id="edBilledNote" value="' + esc(e.billed_note || '') + '"></div>' +

    '<div class="field"><label for="edShip">วันนัดส่งใหม่</label>' +
      '<input type="date" id="edShip" value="' + isoDate(e.newship) + '">' +
      '<div class="hint">ถ้าผู้ขายเลื่อนวัน ใส่วันใหม่ที่นี่</div></div>' +
    '<div class="field"><label for="edIntl">สถานะของนำเข้า</label>' +
      '<select id="edIntl">' + opts + '</select></div>' +

    '<div class="field full"><label for="edNote">หมายเหตุ / ติดตามถึงไหน</label>' +
      '<textarea id="edNote" placeholder="เช่น โทรตามแล้ว 12/9 ผู้ขายแจ้งของเข้าสัปดาห์หน้า">' +
      esc(e.note || '') + '</textarea></div>' +

    '<div class="field full"><label class="chk' + (e.closed ? ' on' : '') + '" id="edClosedBox">' +
      '<input type="checkbox" id="edClosed"' + (e.closed ? ' checked' : '') +
      ' onchange="edToggleClose()"> ปิดรายการนี้ — ไม่ต้องตามของแล้ว</label>' +
      '<div id="edReasonWrap" class="' + (e.closed ? '' : 'hide') + '" style="margin-top:10px">' +
        '<label for="edReason">เหตุผลที่ปิด (บังคับ)</label>' +
        '<input type="text" id="edReason" value="' + esc(e.close_reason || '') +
        '" placeholder="เช่น ยกเลิกกับผู้ขายแล้ว / สั่งซ้ำ / ไม่ผลิตแล้ว"></div></div>' +
    '</div>' +
    '<div class="msg" id="edMsg"></div>';

  $('edBody').innerHTML = h;
  document.querySelector('#editModal .mh .sub').textContent =
    r.found ? 'เคยกรอกไว้แล้ว · แก้ล่าสุดโดย ' + (e.by_emp || '-') : 'ยังไม่เคยกรอก';

  var box = document.querySelector('#editModal .box');
  var f = document.createElement('div');
  f.className = 'mf';
  f.innerHTML = '<button class="btn ghost" onclick="opCloseEdit()">ยกเลิก</button>' +
                '<button class="btn" id="edSave" onclick="edSave()">บันทึก</button>';
  box.appendChild(f);
}

function isoDate(v){
  if(!v) return '';
  var d = new Date(v);
  if(isNaN(d.getTime())) return '';
  var p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function edToggleClose(){
  var on = $('edClosed').checked;
  $('edClosedBox').className = 'chk' + (on ? ' on' : '');
  $('edReasonWrap').className = on ? '' : 'hide';
}

function edSave(){
  if(!EDITING) return;
  var p = {
    poid: EDITING.poid, listno: EDITING.ln, docuno: EDITING.po,
    recv_manual: $('edRecv').value.trim(),
    recv_date: $('edRecvDate').value,
    billed_amount: $('edBilled').value.trim(),
    billed_note: $('edBilledNote').value.trim(),
    newship: $('edShip').value,
    note: $('edNote').value.trim(),
    intl_status: $('edIntl').value,
    closed: $('edClosed').checked,
    close_reason: $('edReason') ? $('edReason').value.trim() : ''
  };
  if(p.closed && !p.close_reason){
    say('edMsg', 'ปิดรายการต้องใส่เหตุผลด้วย', 'err'); return;
  }
  busy('edSave', true, 'กำลังบันทึก...');
  google.script.run
    .withSuccessHandler(function(r){
      busy('edSave', false, 'บันทึก');
      say('edMsg', r.msg, 'ok');
      setTimeout(function(){ opCloseEdit(); loadOpenPO(); }, 900);
    })
    .withFailureHandler(function(e){
      busy('edSave', false, 'บันทึก');
      say('edMsg', e.message, 'err');
    })
    .savePoEdit(AUTH, p);
}

function opRebuild(){
  busy('opRb', true, 'กำลังคำนวณ...');
  google.script.run
    .withSuccessHandler(function(r){
      busy('opRb', false, 'คำนวณค้างรับใหม่');
      loadOpenPO();
    })
    .withFailureHandler(function(e){
      busy('opRb', false, 'คำนวณค้างรับใหม่');
      alert('คำนวณไม่สำเร็จ: ' + e.message);
    })
    .psRebuild(AUTH);
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $('editModal')) opCloseEdit();
});
</script>
